# ニュースを定期的に取得して、GitHub Pages に公開する
# - 約30分ごとに自動実行。GitHub の定期実行(schedule)は混雑で数時間あくことがあるため、
#   公開が終わったら約27分待って次の実行を自分で予約する(「次の実行を予約」の段)。
#   定期実行は、この予約が途切れたときに再開させる役目
# - コードを更新(push)したときにも実行
# - GitHub の Actions 画面から手動でも実行できる(Run workflow ボタン)
name: Update news and publish

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 長期間放置で定期実行が止まらないようにするための空コミット用
  pages: write
  id-token: write
  actions: write    # 次の実行を予約するため

jobs:
  build:
    runs-on: ubuntu-latest
    # 公開の作業は同時に1つだけ(待っている間の「次の実行を予約」はこの対象外)
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      # 正確さのルール(新しい順・重複・関連性・失敗の表示など)が壊れていないかを確かめる。失敗したら公開しない
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch news and build pages
        run: python build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 公開リポジトリは60日間更新がないと定期実行が自動停止するため、
      # 最後の更新から50日たったら空のコミットを入れて止まらないようにする
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((50 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates alive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Vercel 版も最新ニュースで作り直す(コードの push 時は Vercel が自動で作り直すので、定期実行・手動実行のときだけ)
      # VERCEL_DEPLOY_HOOK(リポジトリの Secrets)が未登録なら何もしない
      - name: Refresh Vercel site
        if: github.event_name != 'push'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          # Vercel の無料プランは1日の公開回数に上限があるので、依頼は約2時間に1回にする
          if [ $(( $(date +%s) / 1800 % 4 )) -ne 0 ]; then
            echo "Vercel の再公開は約2時間に1回のため、今回はスキップします"
          elif [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
            echo "Vercel の再公開を依頼しました"
          else
            echo "VERCEL_DEPLOY_HOOK が未登録のため、Vercel の再公開はスキップします"
          fi

  # 約27分待ってから、次の実行を予約する(GitHub の定期実行の遅れに頼らず、約30分ごとに更新するため)。
  # すでに別の実行が動いている・待っているときは予約しない(実行が二重・三重に増えないようにする)。
  # 公開リポジトリなので、GitHub Actions の利用は無料
  schedule-next:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait about 27 minutes
        run: sleep 1620
      - name: Start the next run unless another one is already running
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          others=$(gh run list --workflow publish.yml --limit 20 --json databaseId,status             --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$others" -gt 0 ]; then
            echo "ほかの実行(${others}件)が動いているため、次の実行は予約しません"
          else
            gh workflow run publish.yml --ref main
            echo "次の実行を予約しました"
          fi
